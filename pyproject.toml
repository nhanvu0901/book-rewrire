[project]
name = "pov-retell"
version = "0.1.0"
description = "POV story retelling: phase A only (book loading and extraction)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "ebooklib>=0.18",
    "httpx>=0.27",
    "openai>=1.54",
    "typer>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
pov = "pov_retell.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pov_retell"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["doc", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008"]  # typer declares options as default arguments

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true  # ebooklib ships no type stubs

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
    "local_books: runs the real books in BOOK_CLONE_DATA_DIR/books (opt-in: POV_LOCAL_BOOKS=1)",
]
